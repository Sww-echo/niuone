<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>牛牛1号</title>
    <script>
      (() => {
        const themeStorageKey = 'niuone-dashboard-theme-v1';
        const cornerStorageKey = 'niuone-dashboard-corners-v1';
        let theme = '';
        let corners = '';
        try {
          theme = localStorage.getItem(themeStorageKey) || '';
          corners = localStorage.getItem(cornerStorageKey) || '';
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark' && theme !== 'tongdaxin' && theme !== 'tongdaxin-light') {
          theme = 'light';
        }
        if (corners !== 'rounded' && corners !== 'square') corners = 'square';
        const isTongdaxin = theme === 'tongdaxin' || theme === 'tongdaxin-light';
        document.documentElement.dataset.theme = isTongdaxin ? 'tongdaxin' : theme;
        if (isTongdaxin) {
          document.documentElement.dataset.tongdaxinPalette = theme === 'tongdaxin-light' ? 'light' : 'dark';
        }
        document.documentElement.dataset.corners = corners;
      })();
    </script>
    <link rel="icon" type="image/png" sizes="256x256" href="/src/assets/niuone-logo.png" />
  </head>
  <body>
    <div id="app"><div class="app-bootstrap-loading">加载中…</div></div>
    <noscript>牛牛1号需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
